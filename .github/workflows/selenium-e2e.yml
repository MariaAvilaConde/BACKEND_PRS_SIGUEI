name: Frontend Selenium E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  selenium-e2e:
    name: Ejecutar Selenium en frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: "npm"
          cache-dependency-path: "vg-web-sigei-develop/package-lock.json"

      - name: Install Chromium browser
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq chromium

      - name: Install frontend dependencies
        working-directory: vg-web-sigei-develop
        run: npm install

      - name: Build frontend
        working-directory: vg-web-sigei-develop
        run: npm run build

      - name: Start preview server
        working-directory: vg-web-sigei-develop
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          sleep 5
          if ! curl --silent --head http://127.0.0.1:4173 > /dev/null; then
            echo "Preview server failed to start. Output from /tmp/preview.log:"
            cat /tmp/preview.log
            exit 1
          fi

      - name: Wait for frontend
        working-directory: vg-web-sigei-develop
        run: npx wait-on http://127.0.0.1:4173 --timeout 30000

      - name: Run Selenium smoke test
        working-directory: vg-web-sigei-develop
        env:
          CHROME_BIN: "/usr/bin/chromium"
        run: npm run selenium-test

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then
            kill "$(cat /tmp/preview.pid)" || true
          fi
