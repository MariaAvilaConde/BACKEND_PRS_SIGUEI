server:
     port: ${SERVER_PORT:9090}
     forward-headers-strategy: framework

spring:
     profiles:
          active: ${SPRING_PROFILES_ACTIVE:dev}

     application:
          name: psychology-welfare-service

     r2dbc:
          url: r2dbc:postgresql://${DB_HOST:173.212.240.114}:${DB_PORT:5432}/${DB_NAME:sigei_psychology}?sslMode=${DB_SSL_MODE:disable}
          username: ${DB_USERNAME:postgres}
          password: ${DB_PASSWORD:bDLQyGI0Uwov0ZXCYzp0}
          pool:
               initial-size: 5
               max-size: 20
               max-idle-time: 30m

     security:
          oauth2:
               resourceserver:
                    jwt:
                         issuer-uri: ${KEYCLOAK_ISSUER_URI:https://sigei.ddns.net/keycloak/realms/sigei}
                         jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://sigei.ddns.net/keycloak/realms/sigei/protocol/openid-connect/certs}

logging:
     pattern:
          console: "%d{HH:mm:ss.SSS} %highlight(%-5level) [%cyan(%logger{20})] %msg%n"
     level:
          root: INFO
          pe.edu.vallegrande.sigei.psychology.welfare: INFO
          org.springframework.r2dbc: WARN
          io.r2dbc.postgresql: WARN
          org.springframework.security: WARN

springdoc:
     api-docs:
          enabled: true
          path: /api-docs
     swagger-ui:
          enabled: true
          path: /swagger-ui.html

management:
     endpoints:
          web:
               exposure:
                    include: "health,info,metrics"
               base-path: /actuator
     endpoint:
          health:
               show-details: when-authorized
     health:
          db:
               enabled: true

microservices:
     students:
          url: ${STUDENTS_SERVICE_URL:http://localhost:9081}
     institutions:
          url: ${INSTITUTIONS_SERVICE_URL:http://localhost:9080}
     users:
          url: ${USERS_SERVICE_URL:http://localhost:9083}
